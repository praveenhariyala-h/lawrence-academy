journey:
  title: Our Journey
  body: |-
    Our journey began in 1991 with the establishment of our first school in Koramangala. Over the past 35 years, Lawrence High School ICSE, HSR has grown into a trusted name in ICSE education, rooted in academic excellence, holistic development, and strong values.

    As the world evolves, our purpose remains constant—to nurture confident, compassionate, and capable young minds who are prepared not just for the future, but to shape it.
  photos:
    - src: about/journey.png
      alt: Lawrence High School leadership lighting a ceremonial lamp at a school event
    - src: home/hero/hero-campus.png
      alt: Lawrence High School campus in HSR Layout, Bengaluru
  visionTitle: Our Vision
  visionText: To create an environment that inspires and guides a child through exploration to discovery, learning and action, so they grow into a confident, capable citizen of the future.
  missionTitle: Our Mission
  missionText: To provide education with a value that develops knowledge, skills, character and a lifelong love for learning.
philosophy:
  title: Our Educational Philosophy
  body: We believe that every child is unique and has the potential to achieve great things. Our approach is student-centric, focusing on academic rigour, character building and experiential learning. We strive to create a supportive environment where curiosity is encouraged, creativity is celebrated and values are lived every day.
  image: philosophy.png
  imageAlt: Lawrence High School leaders collaborating on teaching and learning
messages:
  title: Messages from Our Leadership
  kicker: Guided by vision, grounded in values, committed to every child.
  people:
    - name: Mr. P.M. Subbaiah
      role: Chairman
      photo: chairman.png
      photoAlt: Mr. P.M. Subbaiah, Chairman of Lawrence High School
      initials: PMS
      position: 78% 12%
      message: Education for us isn’t just about books, but about life itself — building character, shaping mindsets, and preparing children for a meaningful future. Long-serving, dedicated teachers work with every child, enabling them to discover strengths, face challenges, and grow into confident individuals who will be the changemakers of our society.
    - name: Mrs. Pushpa Subbaiah
      role: Managing Trustee
      photo: managing-trustee.png
      photoAlt: Mrs. Pushpa Subbaiah, Managing Trustee of Lawrence High School
      initials: PS
      position: 38% 18%
      message: We work to create a school where every learner is known, supported and stretched. Education at Lawrence is not only academic excellence; it is the partnership between students, teachers and families. Our role is to make sure that partnership stays strong, so every child can grow with dignity, curiosity and joy.
    - name: Mrs. Supriya Johnson
      role: Principal
      photo:
      photoAlt: Mrs. Supriya Johnson, Principal of Lawrence High School
      initials: SJ
      position: center center
      message: At Lawrence High School, we believe every child is unique and has the potential to achieve great things. Our goal is to provide a nurturing and stimulating environment where students discover their strengths, develop character, and grow into confident, capable citizens. We work closely with parents to make school a second home.
