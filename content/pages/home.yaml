legacyTitle: Lawrence Legacy
legacyBody: >-
  **Lawrence High School** carries a legacy of educational excellence that began
  in **1991 with our Koramangala branch** and grew with the establishment of our
  **HSR ICSE branch in 2002**.


  Today, Lawrence is a vibrant learning community of **over 2,500 students and
  103+ dedicated teachers**, committed to providing an education that nurtures
  **knowledge, character and confidence**.


  With a strong foundation built on **values and holistic development**, we
  continue to prepare young minds to learn, grow and contribute meaningfully to
  the world.
legacyTagline: Our Legacy. Our Values. Their Future.
legacyPhotoAlt: Lawrence High School campus, HSR Layout
whyTitle: What Makes the School Special?
whyQuote: “FROM CURIOUS MINDS TO CONFIDENT FUTURES.”
whyBody: >-
  At Lawrence High, every experience is an opportunity to discover, create, lead
  and grow. We help students transform their potential into purpose and their
  dreams into achievement.
whyImageAlt: >-
  Why choose Lawrence High School: academic excellence, future ready learning,
  beyond academics, character and values, confidence and leadership, holistic
  growth, and a safe caring campus
