chairmanKicker: Chairman’s message
chairmanName: P.M. Subbaiah
chairmanRole: Chairman, Lawrence High School
chairmanMessage: >-
  Dear Parents, over the past 35 years, Lawrence School HSR and Koramangala have
  grown into schools that nurture champions. Education for us isn’t just about
  books but about life itself — building character, shaping mindsets, and
  preparing children for a meaningful future.


  Long-serving, dedicated teachers work with every child, enabling them to
  discover strengths, face challenges, and grow into confident individuals who
  will be the future leaders and changemakers of our society. We look forward to
  walking this journey with you — hand in hand.
chairmanPhoto: chairmanPhoto.JPG
chairmanPhotoAlt: P.M. Subbaiah, Chairman, Lawrence High School
